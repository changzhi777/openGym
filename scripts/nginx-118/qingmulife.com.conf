server {
    if ($host = app.qingmulife.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.qingmulife.com qingmulife.com www.qingmulife.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://app.qingmulife.com$request_uri; }


}

server {
    listen 443 ssl http2;
    server_name app.qingmulife.com;
    # 2026-11-18 审查轮批次 C:TLS 参数对齐 api 块(web 容器模板四头 + HSTS;
    # 此前生产裸奔无安全头;add_header 在 location 内会整组替换,本文件各
    # location 未再设头,server 级一次即可)。
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-c5466d652d67589680c94a80ed92a090b8637448ac9d8d0c89199ac75e9a1858'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 上面 CSP 2026-11-24 回流现网完整版(上游 03b227ce5 对齐:inline 脚本按 hash
    # 白名单,muhe-fit deploy 流程 check-csp.mjs 守护 hash 漂移)——此前仓库版只有
    # frame-ancestors 'none',整文件覆盖会降级现网头。
    # 2026-11-24:sw.js 与 index.html 下发 no-cache——此前两文件无 Cache-Control,
    # WebView 启发式缓存旧 sw.js → SW 更新检查拿不到新字节,存量设备旧 SW 永生伺服
    # 旧前端、重装 APK 不换血(FORK.md §5 台账)。hashed /assets/ 不设块(与现网一致,
    # 靠 etag/last-modified 默认行为)。add_header 在 location 内整组替换,安全头组
    # 必须在每个设头 location 重复(server 级不进新 location),勿删。
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-c5466d652d67589680c94a80ed92a090b8637448ac9d8d0c89199ac75e9a1858'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-c5466d652d67589680c94a80ed92a090b8637448ac9d8d0c89199ac75e9a1858'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    # 媒体链路上限 40MB(MEDIA_VIDEO_MAX_MB),12m 曾在 nginx 层 413 掉视频上传。
    client_max_body_size 48m;

    root /opt/muhe-fit/web;
    index index.html;

    # SPA 路由(/admin 深链回 index)
    location / { try_files $uri $uri/ /index.html; }

    # API 同源反代(openGym 架构:同源 cookie)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 2026-11-18 审查轮批次 B:XFF 覆写(原 $proxy_add_x_forwarded_for 追加式
        # 会保留客户端伪造链;与 web 容器模板同口径,Go 侧只信回环代理)。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # SSE(/api/admin/live)已由上面 location 覆盖;nginx 默认对 event-stream 不缓冲
    # 长连接需关缓冲:
    proxy_buffering off;

    ssl_certificate /etc/letsencrypt/live/app.qingmulife.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.qingmulife.com/privkey.pem; # managed by Certbot
}

server {
    listen 443 ssl http2;
    server_name qingmulife.com www.qingmulife.com;
    ssl_certificate /etc/letsencrypt/live/qingmulife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qingmulife.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://app.qingmulife.com;
}
