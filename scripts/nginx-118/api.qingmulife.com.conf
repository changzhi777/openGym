server {
    server_name api.qingmulife.com;
    client_max_body_size 12m;

    location /admin-v2/ {
        root /opt/qm-app-test/server/public;
        try_files $uri $uri/ /admin-v2/index.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 2026-11-18 审查轮批次 B:XFF 覆写,丢弃客户端伪造链(同 qingmulife.com.conf)。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.qingmulife.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.qingmulife.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = api.qingmulife.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.qingmulife.com;
    return 404;
}
