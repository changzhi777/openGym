server {
    server_name api.qingmulife.com;
    # 批次 C:安全四头 + HSTS(此前 API 域无任何安全头)+ 媒体体积帽 48m。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 48m;

    location /admin-v2/ {
        root /opt/qm-app-test/server/public;
        try_files $uri $uri/ /admin-v2/index.html =404;
    }

    # 2026-11-24:admin-v2 SPA 入口 no-cache(同 app 域 sw.js/index.html 治本逻辑:
    # 无 Cache-Control 时 WebView 启发式缓存旧入口文件)。add_header 在 location 内
    # 整组替换,安全头组在此重复(server 级不进新 location),勿删;root 需自带
    # (location 间不互相继承,只继承 server 级)。
    location = /admin-v2/index.html {
        root /opt/qm-app-test/server/public;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 2026-11-18 审查轮批次 B:XFF 覆写,丢弃客户端伪造链(同 qingmulife.com.conf)。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.qingmulife.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.qingmulife.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = api.qingmulife.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.qingmulife.com;
    return 404;
}
