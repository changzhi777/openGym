# nginx-183.conf — openGym 测试版 183 一站式口(3131):
# PWA dist 静态(SPA fallback) + /api 与 /coach-console 反代 api 容器(compose 网络内服务名)。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PWA SPA:无扩展名路径回落 index.html(react-router 前端路由)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 媒体与构建产物缓存(带 hash 的 assets 指纹文件)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API 反代(compose 网络内服务名;会话 cookie 原样透传)
  location /api/ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
  # 教练台 = PWA 内 /coach-console React 路由(走上方 SPA fallback 返回 index.html),
  # 非 muhe_fit 线的 embed HTML——勿在此反代(反代只会撞 NoRoute 501)。
}
